[project]
name = "handbook-tools"
version = "0.1.0"
description = "Shared MkDocs build tooling for the St Margaret's College handbooks"
requires-python = ">=3.10"

dependencies = [
    # The hooks are MkDocs hooks, and the DOCX export parses the HTML the
    # to-pdf plugin writes and converts it with pandoc. pypandoc-binary is a
    # wheel bundling the pandoc binary, so no system install is needed.
    "mkdocs==1.6.1",
    "beautifulsoup4>=4.12",
    "pypandoc-binary==1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handbook_tools"]
